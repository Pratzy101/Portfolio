<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG image source — 1200×630</title>
<!-- ============================================================================
     SOURCE FOR assets/og-image.png

     The committed PNG was rendered without Space Grotesk installed, so it uses
     a substitute face. This file is the brand-exact version.

     To regenerate:
       1. Open this file in Chrome
       2. Cmd+Opt+I -> device toolbar -> Responsive -> set 1200 x 630
       3. Cmd+Shift+P -> "Capture screenshot"
       4. Save over assets/og-image.png
       5. Re-share the link on LinkedIn to bust their preview cache

     This file is never linked from the site. It exists only to produce the PNG.
     ============================================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#333; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card{
    width:1200px; height:630px; background:#0a0a0a; position:relative;
    padding:80px; display:flex; flex-direction:column; justify-content:space-between;
    overflow:hidden;
  }
  .card::before{
    content:''; position:absolute; inset:0; pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
    background-size:48px 48px;
  }
  .card > *{ position:relative; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace; font-size:19px; letter-spacing:0.14em;
    color:#a8a8a8; text-transform:uppercase;
  }
  h1{
    font-family:'Space Grotesk', sans-serif; font-size:86px; font-weight:600;
    line-height:1.0; letter-spacing:-0.025em; color:#f4f4f2;
  }
  h1 .dim{ color:#6e6e6e; display:block; }
  h1 span{ display:block; }
  .foot{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-top:1px solid #2d2d2d; padding-top:28px;
    font-family:'JetBrains Mono', monospace; font-size:17px; letter-spacing:0.1em;
    text-transform:uppercase;
  }
  .foot .role{ color:#a8a8a8; }
  .foot .loc{ color:#6e6e6e; }
</style>
</head>
<body>
  <div class="card">
    <div class="eyebrow">Prathit Shaandilya</div>
    <h1>
      <span>Data analyst</span>
      <span class="dim">turned AI</span>
      <span>systems builder.</span>
    </h1>
    <div class="foot">
      <span class="role">AI Engineer / Solutions Architect</span>
      <span class="loc">Noida, India</span>
    </div>
  </div>
</body>
</html>
